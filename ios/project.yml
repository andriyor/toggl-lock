name: LockActivity
options:
  bundleIdPrefix: com.andriyor
  # match swift-format's defaults so Xcode doesn't fight the formatter
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
  deploymentTarget:
    iOS: "18.0"  # supplementalActivityFamilies (Apple Watch layout)
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: A9GA52LYQQ
    CODE_SIGN_STYLE: Automatic
targets:
  LockActivity:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Toggl Lock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        ServerURL: $(SERVER_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Sends Live Activity push tokens to your server.
        AppSecret: $(APP_SECRET)
    entitlements:
      path: App/LockActivity.entitlements
      properties:
        aps-environment: development
    # APP_SECRET (server/.env) lives in the gitignored Secrets.xcconfig: this repo is public
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    dependencies:
      - target: LockWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andriyor.LockActivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SERVER_URL: https://toggl.oreh.uk
  LockWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andriyor.LockActivity.LockWidget
